name: Anime Routing Regression

on:
  push:
    branches:
      - feature/anime-routing

permissions:
  contents: read

concurrency:
  group: anime-routing-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anime-settings:
    name: Anime settings regression test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json "packageManager" (pnpm@10.24.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Run anime settings regression test
        run: pnpm test server/test/MediaRequestAnimeSettings.test.ts

      # Temporary: broader checks for the anime defaults fix.
      - name: Typecheck server
        if: ${{ !cancelled() }}
        run: pnpm typecheck:server

      - name: Run request and dispatch suites
        if: ${{ !cancelled() }}
        run: pnpm test server/routes/request.test.ts server/test/MediaRequestSubscriber.test.ts
